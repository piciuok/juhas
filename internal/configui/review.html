<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juhas — Review proposal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='19' rx='4' fill='%23a371f7'/%3E%3Cpath d='M9 24l-2 6 8-6z' fill='%23a371f7'/%3E%3Cpath d='M9 14l4 4 9-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root { --bg: #f6f7f9; --panel: #fff; --text: #1d2125; --muted: #626f7a; --line: #dfe3e8; --accent: #2f81f7; --ok: #1f883d; --warn: #b7791f; --err: #cf222e; --chip: #eef1f4; --input: #fff; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --panel: #191d22; --text: #e6e9ec; --muted: #9aa4ae; --line: #2c333a; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --err: #f85149; --chip: #232a31; --input: #0f1216; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Cantarell, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 15px; flex: 1; min-width: 240px; }
header h1 a { color: var(--text); text-decoration: none; } header h1 a:hover { color: var(--accent); }
.sub { color: var(--muted); font-size: 12.5px; font-weight: 400; display: block; }
button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
button.no.on { background: var(--err); border-color: var(--err); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
main { max-width: 980px; margin: 0 auto; padding: 16px 20px 80px; }
.banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid; }
.banner.warn { border-color: var(--warn); color: var(--warn); }
.banner.err { border-color: var(--err); color: var(--err); }
.banner.ok { border-color: var(--ok); color: var(--ok); }
.verdict { margin: 0 0 14px; font-size: 15px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.card.accepted { border-color: var(--ok); }
.card.rejected { opacity: .5; }
.card.posted { border-color: var(--accent); }
.card.failed { border-color: var(--err); }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.loc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 600; word-break: break-all; }
.sev { font-size: 11.5px; padding: 1px 7px; border-radius: 9px; background: var(--chip); }
.sev.BLOCK, .sev.high { color: var(--err); } .sev.WARN, .sev.medium { color: var(--warn); }
.spacer { flex: 1; }
textarea { width: 100%; min-height: 70px; font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); color: var(--text); resize: vertical; }
textarea:disabled { border-style: dashed; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.note a { color: var(--accent); }
.note.err { color: var(--err); }
.view { margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.view .tabs { display: flex; gap: 6px; align-items: center; padding: 5px 8px; background: var(--chip); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.view .tabs button { font-size: 12px; padding: 2px 9px; }
.view .tabs button.on { border-color: var(--accent); color: var(--accent); }
.code { position: relative; max-height: 420px; overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--input); }
.code table { border-collapse: collapse; min-width: 100%; }
.code td { padding: 0 8px; white-space: pre; vertical-align: top; }
.code td.n { color: var(--muted); text-align: right; user-select: none; width: 1%; border-right: 1px solid var(--line); }
.code tr.add td.t { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.code tr.del td.t { background: color-mix(in srgb, var(--err) 14%, transparent); }
.code tr.hunk td { color: var(--muted); background: var(--chip); }
.code tr.hit td { background: color-mix(in srgb, var(--warn) 30%, transparent) !important; }
.code .msg { padding: 10px; color: var(--muted); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
footer .count { color: var(--muted); font-size: 13px; margin-right: auto; }
footer select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.verdict .dec { font-size: 13px; margin-left: 8px; }
/* chat on the right */
:root { --chat-w: 420px; }
#chat { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--chat-w), 100vw); z-index: 10; background: var(--panel); border-left: 1px solid var(--line); display: none; flex-direction: column; }
body.chat-on #chat { display: flex; }
@media (min-width: 1100px) {
  body.chat-on header, body.chat-on main, body.chat-on footer { margin-right: var(--chat-w); }
  body.chat-on footer { right: var(--chat-w); margin-right: 0; }
  body.chat-on main { margin-left: max(0px, calc((100vw - var(--chat-w) - 980px) / 2)); }
}
@media (max-width: 1099px) { body.chat-on #chat { box-shadow: -8px 0 24px rgba(0,0,0,.25); } }
#chat .chead { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
#chat .chead b { flex: 1; font-size: 14px; }
#chat .csub { padding: 6px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
#msgs { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.cm { border-radius: 10px; padding: 8px 11px; max-width: 100%; overflow-wrap: anywhere; font-size: 13.5px; }
.cm.user { align-self: flex-end; background: color-mix(in srgb, var(--accent) 16%, var(--panel)); white-space: pre-wrap; max-width: 88%; }
.cm.assistant { background: var(--chip); }
.cm.note { align-self: center; font-size: 12px; color: var(--muted); background: none; padding: 2px 6px; text-align: center; }
.cm.note.err { color: var(--err); }
.cm p { margin: 0 0 6px; } .cm p:last-child { margin-bottom: 0; }
.cm h1, .cm h2, .cm h3, .cm h4 { font-size: 13.5px; margin: 8px 0 4px; }
.cm ul, .cm ol { margin: 4px 0 6px; padding-left: 20px; }
.cm code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--input); padding: 0 3px; border-radius: 3px; }
.cm pre { background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; overflow: auto; margin: 6px 0; }
.cm pre code { background: none; padding: 0; white-space: pre; }
.cm a { color: var(--accent); }
.sugg { border: 1px dashed var(--accent); border-radius: 8px; padding: 7px 9px; margin: 6px 0; background: var(--panel); }
.sugg .loc { font-size: 12px; }
.sugg .body { white-space: pre-wrap; margin: 4px 0 6px; }
#progress { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap; padding: 6px 14px; border-top: 1px solid var(--line); max-height: 150px; overflow: auto; display: none; }
#chat form { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
#chat form textarea { min-height: 64px; max-height: 40vh; resize: vertical; }
#chat form .row { display: flex; gap: 8px; align-items: center; }
#chat form .row .note { margin: 0; flex: 1; }
</style>
</head>
<body>
<header>
  <h1 id="title">Review proposal</h1>
  <button id="acceptAll">✓ Accept all</button>
  <button id="rejectAll">✕ Reject all</button>
  <button id="chatToggle" title="Ask the agent about its review">💬 Chat</button>
</header>
<aside id="chat" aria-label="Chat about this review">
  <div class="chead"><b>💬 Chat about this review</b>
    <button id="chatReset" title="Forget this conversation; the next question starts again from the review">↺ New</button>
    <button id="chatClose" title="Hide the chat">✕</button></div>
  <div class="csub" id="chatSub">Local: nothing is published. The agent stays read-only.</div>
  <div id="msgs"></div>
  <div id="progress"></div>
  <form id="chatForm">
    <textarea id="chatText" placeholder="Ask about the PR/MR or the review… (Enter sends, Shift+Enter is a new line)"></textarea>
    <div class="row"><span class="note" id="chatNote"></span>
      <button type="button" id="chatStop" style="display:none">⏹ Stop</button>
      <button type="submit" class="primary" id="chatSend">Send</button></div>
  </form>
</aside>
<main>
  <div id="banners"></div>
  <p class="verdict" id="verdict"></p>
  <div id="list"></div>
</main>
<footer>
  <span class="count" id="count"></span>
  <span id="saved" class="count" style="margin-right:0"></span>
  <select id="event" title="What to send with the comments">
    <option value="comment">Comment only</option>
    <option value="approve">✓ Approve (+ accepted comments)</option>
    <option value="request_changes">✕ Request changes (+ accepted comments)</option>
  </select>
  <button class="primary" id="publish" disabled>🚀 Publish accepted</button>
</footer>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const T = q.get("t"), JOB = q.get("job");
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Token": T, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: "HTTP " + r.status }));
  if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
  return j;
}

let P = null, stale = false, confirmForce = 0, publishing = false;
const all = () => (P.summary && P.summary.body ? [P.summary] : []).concat(P.comments || []);
const EVENT = { comment: "comment only", approve: "approve", request_changes: "request changes" };
const LABEL = { pending: "awaiting decision", accepted: "accepted", rejected: "rejected", posted: "published", failed: "publish failed" };

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  $("#saved").textContent = "…";
  saveTimer = setTimeout(async () => {
    try {
      // the page stays the source of truth: replacing P here would leave the
      // cards bound to the old objects and swallow the next clicks
      await api("/api/review/save", { job: JOB, comments: all().map((c) => ({ id: c.id, body: c.body, status: c.status })) });
      $("#saved").textContent = "saved"; counts();
    } catch (e) { $("#saved").textContent = "save failed: " + e.message; }
  }, 400);
}

function counts() {
  const a = all();
  const acc = a.filter((c) => c.status === "accepted").length;
  const pend = a.filter((c) => c.status === "pending").length;
  const posted = a.filter((c) => c.status === "posted").length;
  $("#count").textContent = `${acc} accepted · ${pend} awaiting decision · ${posted} published`;
  if (publishing) return; // the button stays "Publishing…" until the server answers
  const ev = $("#event").value;
  $("#publish").disabled = acc === 0 && ev === "comment";
  const n = acc === 1 ? "1 accepted comment" : `${acc} accepted comments`;
  $("#publish").textContent = ev === "approve" ? (acc ? `✓ Approve with ${n}` : "✓ Approve")
    : ev === "request_changes" ? (acc ? `✕ Request changes with ${n}` : "✕ Request changes")
    : acc ? `🚀 Publish ${n}` : "🚀 Publish accepted";
  $("#publish").title = ev === "comment" ? "Posts the accepted comments" : acc
    ? "Posts the accepted comments first, then sends the decision — not sent if a comment fails"
    : "Sends only the decision: accept comments above to send them with it";
}

// File preview: the diff of the file a comment is about, or the whole file at
// the reviewed commit, with the commented line marked — without leaving the page.
const files = {}, views = {}; // file -> Promise<FileView>; comment id -> "diff" | "file"
const fileView = (f) => files[f] || (files[f] = api(`/api/review/file?job=${JOB}&file=${encodeURIComponent(f)}`).catch((e) => { delete files[f]; throw e; }));

function rows(lines, line) {
  let hit = null;
  const tb = h("tbody");
  for (const l of lines) {
    const tr = h("tr", { class: l.cls || "" }, h("td", { class: "n" }, l.old ?? ""), h("td", { class: "n" }, l.nu ?? ""), h("td", { class: "t" }, l.text || " "));
    if (line > 0 && l.nu === line && !hit) { tr.classList.add("hit"); hit = tr; }
    tb.append(tr);
  }
  return [h("table", {}, tb), hit];
}

function diffLines(patch) {
  const out = []; let o = 0, n = 0;
  for (const t of patch.replace(/\n$/, "").split("\n")) {
    const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(t);
    if (m) { o = +m[1]; n = +m[2]; out.push({ cls: "hunk", text: t }); continue; }
    if (t.startsWith("\\")) continue; // "\ No newline at end of file"
    if (t.startsWith("+")) out.push({ cls: "add", nu: n++, text: t });
    else if (t.startsWith("-")) out.push({ cls: "del", old: o++, text: t });
    else out.push({ old: o++, nu: n++, text: t });
  }
  return out;
}

function preview(c) {
  const mode = views[c.id];
  const box = h("div", { class: "code" }, h("div", { class: "msg" }, "Loading…"));
  const tab = (m, label) => h("button", { class: m === mode ? "on" : "", onclick: () => { views[c.id] = m; render(); } }, label);
  const el = h("div", { class: "view" }, h("div", { class: "tabs" }, tab("diff", "Diff"), tab("file", "Whole file"),
    h("span", { class: "spacer" }), P.head_sha ? "at " + String(P.head_sha).slice(0, 10) : ""), box);
  fileView(c.file).then((v) => {
    const msg = (t) => box.replaceChildren(h("div", { class: "msg" }, t));
    let lines;
    if (mode === "diff") {
      if (!v.patch) return msg(v.deleted ? "The file is deleted." : "This file has no diff in the PR/MR (unchanged, or too large to show).");
      lines = diffLines(v.patch);
    } else {
      if (v.error) return msg("Couldn't load the file: " + v.error);
      if (v.deleted) return msg("The file is deleted in this PR/MR.");
      if (v.binary) return msg("Binary file.");
      lines = v.content.replace(/\n$/, "").split("\n").map((t, i) => ({ nu: i + 1, text: t }));
    }
    const [table, hit] = rows(lines, c.line);
    box.replaceChildren(table);
    if (v.truncated && mode === "file") box.append(h("div", { class: "msg" }, "…truncated (file over 1 MB)."));
    if (hit) requestAnimationFrame(() => { box.scrollTop = hit.offsetTop - box.clientHeight / 3; });
    else if (c.line > 0) box.prepend(h("div", { class: "msg" }, `Line ${c.line} is not ${mode === "diff" ? "in the diff" : "in the file"}.`));
  }).catch((e) => box.replaceChildren(h("div", { class: "msg" }, "Couldn't load: " + e.message)));
  return el;
}

function card(c) {
  const posted = c.status === "posted";
  const ta = h("textarea", { disabled: posted || c.status === "rejected" });
  ta.value = c.body;
  ta.addEventListener("input", () => { c.body = ta.value; save(); });
  const set = (st) => { c.status = c.status === st ? "pending" : st; save(); render(); };
  const loc = c.id === "summary" ? "General comment" : (c.line > 0 ? `${c.file}:${c.line}` : c.file);
  return h("div", { class: "card " + c.status },
    h("div", { class: "top" },
      h("span", { class: "loc" }, loc),
      c.severity ? h("span", { class: "sev " + c.severity }, c.severity) : null,
      h("span", { class: "sev" }, LABEL[c.status] || c.status),
      h("span", { class: "spacer" }),
      c.file ? h("button", { title: "Show the file next to the comment", class: views[c.id] ? "on" : "", onclick: () => { views[c.id] = views[c.id] ? null : "diff"; render(); } }, views[c.id] ? "✕ Hide file" : "📄 File") : null,
      posted ? null : h("button", { class: "ok" + (c.status === "accepted" ? " on" : ""), onclick: () => set("accepted") }, "✓ Accept"),
      posted ? null : h("button", { class: "no" + (c.status === "rejected" ? " on" : ""), onclick: () => set("rejected") }, "✕ Reject")),
    c.file && views[c.id] ? preview(c) : null,
    ta,
    posted ? h("div", { class: "note" }, "published: ", h("a", { href: c.posted, target: "_blank", rel: "noopener" }, "view in PR/MR"), c.note ? " · " + c.note : "") : null,
    c.status === "failed" ? h("div", { class: "note err" }, c.error || "error") : null,
    c.status === "rejected" && c.note ? h("div", { class: "note" }, c.note + " — accept it to publish it anyway") : null,
    !posted && c.status !== "rejected" ? h("div", { class: "note" }, "You can edit the text before accepting; it saves automatically.") : null);
}

function verdict() {
  const v = $("#verdict"); v.replaceChildren(P.verdict ? "Agent's verdict: " + P.verdict : "");
  const d = P.decision;
  if (d) v.append(h("span", { class: "dec note" }, d.status === "posted" ? `· sent: ${EVENT[d.event]}` : `· ${EVENT[d.event]} failed: ${d.error}`));
}

function render() {
  const list = $("#list"); list.replaceChildren(...all().map(card));
  if (!all().length) list.append(h("p", { class: "note" }, "The agent proposed no comments."));
  counts();
}

async function load() {
  try {
    const r = await api("/api/review?job=" + JOB);
    P = r.proposal; stale = r.stale;
    document.querySelectorAll("#acceptAll, #rejectAll, footer").forEach((el) => el.style.display = "");
    const ref = P.platform === "github" ? "#" + P.number : "!" + P.number;
    $("#title").replaceChildren(h("a", { href: P.url, target: "_blank", rel: "noopener" }, `${ref} ${P.title}`),
      h("span", { class: "sub" }, `${P.repo} · ${P.agent} · head ${String(P.head_sha || "").slice(0, 10)} · ${new Date(P.created_at).toLocaleString()}`));
    document.title = `📝 ${ref} — review proposal`;
    verdict();
    // a decision already sent is not preselected again
    $("#event").value = P.decision && P.decision.status === "posted" ? "comment" : (P.suggest || "comment");
    const b = $("#banners"); b.replaceChildren();
    if (stale) b.append(h("div", { class: "banner warn" }, `New commits since the review (now ${String(r.head_now).slice(0, 10)}). Line numbers may be off — consider reviewing again.`));
    if (r.lookup_error) b.append(h("div", { class: "banner err" }, "Couldn't check the PR/MR: " + r.lookup_error));
    render();
  } catch (e) {
    if (/^no proposal/.test(e.message)) {
      // nothing to accept here, but the review can still be talked over
      $("#banners").replaceChildren(h("div", { class: "banner warn" }, "The agent proposed no comments for this review. You can still ask about it in the chat — comments it suggests can be added here."));
      document.querySelectorAll("#acceptAll, #rejectAll, footer").forEach((el) => el.style.display = "none");
      if (!chatOpen) setChat(true);
      return;
    }
    $("#banners").replaceChildren(h("div", { class: "banner err" }, e.message));
  }
}

$("#acceptAll").addEventListener("click", () => { all().forEach((c) => { if (c.status === "pending" || c.status === "rejected") c.status = "accepted"; }); save(); render(); });
$("#rejectAll").addEventListener("click", () => { all().forEach((c) => { if (c.status !== "posted") c.status = "rejected"; }); save(); render(); });
$("#publish").addEventListener("click", async () => {
  const force = stale && Date.now() - confirmForce < 5000;
  if (stale && !force) { confirmForce = Date.now(); $("#saved").textContent = "There are new commits — click again within 5 s to publish anyway."; return; }
  if (publishing) return;
  clearTimeout(saveTimer);
  publishing = true;
  $("#publish").disabled = true; $("#publish").textContent = "Publishing…";
  try {
    await api("/api/review/save", { job: JOB, comments: all().map((c) => ({ id: c.id, body: c.body, status: c.status })) });
    const ev = $("#event").value;
    const r = await api("/api/review/publish", { job: JOB, force, event: ev });
    publishing = false;
    P = r.proposal; render(); verdict();
    const failed = all().filter((c) => c.status === "failed").length;
    const d = ev !== "comment" ? P.decision : null;
    const bad = failed || (d && d.status !== "posted");
    let msg = failed ? `Published with errors (${failed}) — check the marked comments.` : "Published the accepted comments.";
    if (d) msg += d.status === "posted" ? ` Sent: ${EVENT[ev]}.` : ` ${EVENT[ev]} failed: ${d.error}`;
    if (d && d.status === "posted") $("#event").value = "comment";
    counts();
    $("#banners").prepend(h("div", { class: "banner " + (bad ? "err" : "ok") }, msg));
  } catch (e) {
    publishing = false;
    if (e.message.startsWith("stale:")) stale = true; // pushed after the page loaded: the next click can force
    $("#banners").prepend(h("div", { class: "banner err" }, e.message + (stale && !force ? " — click Publish again within 5 s to publish anyway." : "")));
    if (stale && !force) confirmForce = Date.now();
    counts();
  }
});
$("#event").addEventListener("change", counts);

// ---- chat ------------------------------------------------------------------
let C = null, chatTimer = null, chatOpen = false;
try { chatOpen = location.hash === "#chat" || localStorage.getItem("juhas.chat") === "1"; } catch (_) { chatOpen = location.hash === "#chat"; }
function setChat(on) {
  chatOpen = on;
  document.body.classList.toggle("chat-on", on);
  $("#chatToggle").classList.toggle("on", on);
  try { localStorage.setItem("juhas.chat", on ? "1" : "0"); } catch (_) {}
  if (on) { loadChat(); setTimeout(() => $("#chatText").focus(), 0); }
}

// md renders the agent's markdown: escaped first, so nothing it writes runs.
function md(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null, para = [];
  const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } if (list) { out.push(`</${list}>`); list = null; } };
  const lines = src.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const fence = /^```(\S*)/.exec(l);
    if (fence) {
      flush();
      const code = [];
      while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
      continue;
    }
    const hd = /^(#{1,4})\s+(.*)/.exec(l);
    const li = /^\s*(?:[-*]|(\d+)\.)\s+(.*)/.exec(l);
    if (hd) { flush(); out.push(`<h${hd[1].length}>${inline(hd[2])}</h${hd[1].length}>`); }
    else if (li) {
      if (para.length) { const l2 = list; list = null; flush(); list = l2; }
      const kind = li[1] ? "ol" : "ul";
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      out.push("<li>" + inline(li[2]) + "</li>");
    } else if (!l.trim()) flush();
    else { if (list) { out.push(`</${list}>`); list = null; } para.push(l); }
  }
  flush();
  return out.join("");
}

function suggestion(c) {
  const where = c.file ? (c.line > 0 ? `${c.file}:${c.line}` : c.file) : "General comment";
  const btn = h("button", { onclick: async (ev) => {
    ev.target.disabled = true;
    try {
      await api("/api/chat/comment", { job: JOB, file: c.file, line: c.line, text: c.body });
      ev.target.textContent = "✓ Added to the proposal";
      load();
    } catch (e) { ev.target.disabled = false; $("#chatNote").textContent = e.message; }
  } }, "➕ Add to the proposal");
  return h("div", { class: "sugg" }, h("div", { class: "loc" }, "💡 " + where), h("div", { class: "body" }, c.body), btn);
}

function message(m) {
  if (m.role === "user") return h("div", { class: "cm user" }, m.text);
  if (m.role === "note") return h("div", { class: "cm note" + (m.error ? " err" : "") }, m.error ? "✗ " + m.text : m.text);
  const el = h("div", { class: "cm assistant" });
  const text = m.text.replace(/```juhas-comment\s*\n[\s\S]*?\n```/g, "").trim();
  el.innerHTML = md(text);
  (m.comments || []).forEach((c) => el.append(suggestion(c)));
  return el;
}

function renderChat() {
  const box = $("#msgs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.replaceChildren(...C.messages.map(message));
  if (!C.messages.length) box.append(h("div", { class: "cm note" }, C.job && C.job.brief
    ? "Ask e.g. “why is this a blocker?”, “is there a test for it?”, “what would a fix look like?”. Suggested comments can go straight to the proposal."
    : "There is no finished review of this PR/MR yet — run one first."));
  if (C.busy) box.append(h("div", { class: "cm note" }, "⏳ the agent is thinking…"));
  if (atBottom || C.busy) box.scrollTop = box.scrollHeight;
  const pr = $("#progress");
  pr.style.display = C.busy && C.progress ? "block" : "none";
  pr.textContent = C.progress || "";
  pr.scrollTop = pr.scrollHeight;
  $("#chatStop").style.display = C.busy ? "" : "none";
  $("#chatSend").disabled = C.busy || !C.available || !(C.job && C.job.brief);
  const j = C.job;
  const agent = C.agent ? (C.agent === "codex" ? "Codex" : "Claude") : "";
  $("#chatSub").textContent = !C.available ? "The chat works while the Juhas tray icon is running."
    : !C.messages.length ? (j && j.resumable ? "Continues the review's own session — the agent remembers what it read." : "Starts a new session from the brief and the proposal.") + " Local: nothing is published."
    : (C.from_review ? `${agent} · continues the review session` : `${agent} · new session from the brief`) + " · read-only · nothing is published";
  if (!P && j) {
    $("#title").replaceChildren(h("a", { href: j.url, target: "_blank", rel: "noopener" }, `${j.ref} ${j.title}`), h("span", { class: "sub" }, `${j.repo} · ${j.method || ""}`));
    document.title = `💬 ${j.ref} — chat`;
  }
}

async function loadChat() {
  clearTimeout(chatTimer);
  try {
    C = await api("/api/chat?job=" + JOB);
    renderChat();
    if (C.busy) chatTimer = setTimeout(loadChat, 1200);
  } catch (e) { $("#chatNote").textContent = e.message; }
}

$("#chatForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const ta = $("#chatText"), text = ta.value.trim();
  if (!text || (C && C.busy)) return;
  $("#chatNote").textContent = "";
  $("#chatSend").disabled = true;
  try {
    await api("/api/chat/send", { job: JOB, text });
    ta.value = "";
  } catch (e) { $("#chatNote").textContent = e.message; }
  loadChat();
});
$("#chatText").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("#chatForm").requestSubmit(); }
});
$("#chatStop").addEventListener("click", async () => { await api("/api/chat/cancel", { job: JOB }).catch(() => {}); loadChat(); });
$("#chatReset").addEventListener("click", async () => {
  if (C && C.busy) return;
  try { await api("/api/chat/reset", { job: JOB }); $("#chatNote").textContent = "New conversation."; } catch (e) { $("#chatNote").textContent = e.message; }
  loadChat();
});
$("#chatToggle").addEventListener("click", () => setChat(!chatOpen));
$("#chatClose").addEventListener("click", () => setChat(false));
setChat(chatOpen);
load();
</script>
</body>
</html>
