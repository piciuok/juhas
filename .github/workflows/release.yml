name: Release

# Push a tag like v0.2.0 (or v0.3.0-rc.1 for a pre-release) to build the
# binaries and publish a GitHub release. Running apps pick it up through
# their update check.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          # macOS needs cgo (menu bar + screen effect), so it builds on a Mac;
          # the arm64 runner cross-compiles amd64 with clang -arch x86_64.
          - { os: macos-14, goos: darwin, goarch: arm64, cgo: "1" }
          - { os: macos-14, goos: darwin, goarch: amd64, cgo: "1" }
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="juhas_${ver}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$dir"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$dir/juhas" ./cmd/juhas
          cp README.md config.example.json "dist/$dir/"
          [ -f LICENSE ] && cp LICENSE "dist/$dir/" || true
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: juhas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made by hand for the tag keeps its title and notes: just add the files
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "Juhas $GITHUB_REF_NAME" --generate-notes --verify-tag $flags
