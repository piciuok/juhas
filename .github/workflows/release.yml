name: Release

# Push a tag like v0.2.0 (or v0.3.0-rc.1 for a pre-release) to build the
# binaries and publish a GitHub release. Running apps pick it up through
# their update check. GitHub sends no push event when more than three tags
# are pushed at once; run it by hand for such a tag (Actions → Release →
# Run workflow, or gh workflow run release.yml -f tag=v0.3.0).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    # only the owner releases, even if collaborators get write access later
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      - run: go vet ./... && go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          # macOS needs cgo (menu bar + screen effect), so it builds on a Mac;
          # the arm64 runner cross-compiles amd64 with clang -arch x86_64.
          - { os: macos-14, goos: darwin, goarch: arm64, cgo: "1" }
          - { os: macos-14, goos: darwin, goarch: amd64, cgo: "1" }
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ver="${TAG#v}"
          dir="juhas_${ver}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$dir"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$dir/juhas" ./cmd/juhas
          cp README.md config.example.json "dist/$dir/"
          [ -f LICENSE ] && cp LICENSE "dist/$dir/" || true
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: juhas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made by hand for the tag keeps its title and notes: just add the files
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
            exit 0
          fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --title "Juhas $TAG" --generate-notes --verify-tag $flags
